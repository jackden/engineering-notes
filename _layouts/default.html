<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-shell site-header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">Engineering Notes</a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/articles/' | relative_url }}">Articles</a>
          <a href="{{ '/series/' | relative_url }}">Series</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://github.com/jackden/engineering-notes">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="site-shell page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-shell">
        <a href="https://github.com/jackden/engineering-notes">jackden/engineering-notes</a>
        <span> · Public publication edition</span>
      </div>
    </footer>
  </body>
</html>
